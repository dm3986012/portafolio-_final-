<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Semana 08 · Actividad 1</title>
  <style>
    body{margin:0;background:#050b19;color:#edf7ff;font-family:Segoe UI,Arial,sans-serif;padding:32px}
    .card{max-width:960px;margin:auto;background:#0a1730;border:1px solid #1edcff66;border-radius:24px;padding:34px;box-shadow:0 0 40px #00d9ff12}
    h1{font-size:32px;margin:0 0 8px}
    h2{color:#45e5ff;margin:0 0 14px}
    .tag{display:inline-block;padding:7px 12px;border-radius:99px;background:#325eea;color:white;font-size:13px}
    p{color:#b9cbe3;line-height:1.7}
    .box{padding:20px;border-radius:16px;background:#071126;border:1px solid #8a5cff55;margin-top:22px}
    .gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
    .gallery figure{margin:0;background:#050f22;border:1px solid #24558f66;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px #0006}
    .gallery img{display:block;width:100%;height:auto;object-fit:cover;transition:transform .3s}
    .gallery figure:hover img{transform:scale(1.02)}
    .gallery figcaption{padding:10px 14px;font-size:13px;color:#9bb0cc;text-align:center}
    #noImgMsg{color:#6f88ac;font-size:14px}
    @media(max-width:700px){.gallery{grid-template-columns:1fr} body{padding:14px} .card{padding:20px}}
  </style>
</head>
<body>
<main class="card">
  <span class="tag">Semana 08 · Actividad 1</span>
  <h1>Configuración física y distribución de archivos</h1>
  <p><b>Unidad 2 · Desarrollo</b> · FILEGROWTH · Filegroups · Memoria SQL Server</p>

  <div class="box">
    <h2>🖼️ Infografías (vista fotográfica)</h2>
    <p id="noImgMsg">Cargando imágenes… Si no aparecen, sube las fotos a la carpeta <b>img1/</b> con nombres foto-1.jpg, foto-2.jpg…</p>
    <div class="gallery" id="autoGallery" style="display:none"></div>
  </div>
</main>
<script>
(function(){
  var maxNum = 10;
  var gallery = document.getElementById('autoGallery');
  var msg = document.getElementById('noImgMsg');
  var found = false;
  function show(src, num){
    if(!found){ found=true; msg.style.display='none'; gallery.style.display='grid'; }
    var fig = document.createElement('figure');
    var im = document.createElement('img');
    im.src = src; im.alt = 'Infografía ' + num; im.loading = 'lazy';
    var cap = document.createElement('figcaption');
    cap.textContent = 'Página ' + num;
    fig.appendChild(im); fig.appendChild(cap);
    gallery.appendChild(fig);
  }
  function tryNum(num){
    if(num > maxNum) return;
    var src = 'img1/foto-' + num + '.jpg';
    var img = new Image();
    img.onload = function(){ show(src, num); tryNum(num+1); };
    img.onerror = function(){ tryNum(num+1); };
    img.src = src;
  }
  tryNum(1);
})();
</script>
</body>
</html>
