<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Semana 05 · Actividad 2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050b19;
      color: #edf7ff;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .card {
      max-width: 820px;
      margin: 0 auto;
      background: linear-gradient(145deg, #0a1730, #071226);
      border: 1px solid #1edcff44;
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 0 60px #00d9ff15;
    }
    .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 99px;
      background: #325eea;
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      color: #7eb8ff;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .desc {
      color: #a8c0d8;
      line-height: 1.7;
      margin-bottom: 32px;
      font-size: 15px;
    }
    .box {
      background: #071126;
      border: 1px solid #8a5cff44;
      border-radius: 20px;
      padding: 28px;
    }
    .box h2 {
      color: #45e5ff;
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .file-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: #0c1a33;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      text-decoration: none;
      color: #edf7ff;
      transition: all 0.2s ease;
    }
    .file-btn:hover {
      background: #122a4a;
      border-color: #45e5ff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px #00d9ff20;
    }
    .file-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .pdf-icon { background: #ff3b4a22; }
    .file-info {
      flex: 1;
    }
    .file-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 3px;
    }
    .file-desc {
      font-size: 13px;
      color: #8aa4c0;
    }
    .arrow {
      color: #45e5ff;
      font-size: 20px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Semana 05 · Actividad 2</span>
    <h1>Infografía Azure SQL · Grados y Títulos</h1>
    <p class="subtitle">Unidad 2 · Desarrollo</p>
    <p class="desc">Guía ilustrada de los 6 pasos: desde el acceso a Azure hasta la consulta JOIN.</p>

    <div class="box">
      <h2>📘 Evidencia académica</h2>
      <div class="file-list">
        <a class="file-btn" href="Infografia_Azure_SQL_Semana05.pdf" target="_blank">
          <div class="file-icon pdf-icon">🖼️</div>
          <div class="file-info">
            <div class="file-name">Infografia_Azure_SQL_Semana05.pdf</div>
            <div class="file-desc">Infografía completa · 6 pasos ilustrados</div>
          </div>
          <div class="arrow">→</div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
