<style>

*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(168,85,247,.15),transparent),radial-gradient(ellipse 60% 40% at 90% 10%,rgba(34,220,255,.1),transparent)}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;background:rgba(5,12,28,.92);backdrop-filter:blur(20px);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:14px;z-index:50;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.brand-icon{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center}
.profile{text-align:center}.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 8px;border:3px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--cyan),var(--purple)) border-box;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.profile h3{font-size:15px}.profile small{color:var(--muted);font-size:12px}
.badge{display:inline-flex;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(34,220,255,.12);color:var(--cyan);border:1px solid rgba(34,220,255,.25)}
.side-nav{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.side-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);font-size:13.5px;font-weight:500}
.side-nav a:hover,.side-nav a.active{background:linear-gradient(90deg,rgba(34,220,255,.15),rgba(168,85,247,.1));color:#fff}
.side-nav a.active{color:var(--cyan)}.nav-icon{width:20px;text-align:center}
.main{margin-left:260px;padding:28px 30px 50px;width:calc(100% - 260px);max-width:720px}
.page-title{font-size:26px;font-weight:800;margin-bottom:8px}
.lead{color:var(--muted);margin-bottom:22px;font-size:14.5px}
.contact-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(8,16,35,.55);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.contact-row:hover{border-color:rgba(34,220,255,.4)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
@media(max-width:900px){.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--line)}.main{margin-left:0;width:100%;padding:18px}}
</style>
